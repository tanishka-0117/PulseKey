{% extends "base.html" %}

{% block content %}
<div class="row fade-in">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-cog me-2"></i>Application Settings</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="mb-3"><i class="fas fa-user me-2"></i>Account Settings</h5>
                        <div class="mb-3">
                            <label class="form-label">User ID</label>
                            <input type="text" class="form-control" value="{{ user_id }}" readonly>
                            <div class="form-text">Your unique identifier in the system</div>
                        </div>
                        
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="emailNotifications" checked>
                            <label class="form-check-label" for="emailNotifications">Email Notifications</label>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <h5 class="mb-3"><i class="fas fa-shield-alt me-2"></i>Security Settings</h5>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="autoLogout" checked>
                            <label class="form-check-label" for="autoLogout">Auto Logout (24 hours)</label>
                        </div>
                        
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="dataEncryption" checked disabled>
                            <label class="form-check-label" for="dataEncryption">Data Encryption (Always Enabled)</label>
                        </div>
                    </div>
                </div>
                
                <hr>
                
                <h5 class="mb-3"><i class="fas fa-qrcode me-2"></i>QR Code Settings</h5>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="qrSize" class="form-label">QR Code Size</label>
                            <select class="form-select" id="qrSize">
                                <option value="small">Small</option>
                                <option value="medium" selected>Medium</option>
                                <option value="large">Large</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="qrColor" class="form-label">QR Code Color</label>
                            <select class="form-select" id="qrColor">
                                <option value="black" selected>Black</option>
                                <option value="blue">Blue</option>
                                <option value="green">Green</option>
                                <option value="purple">Purple</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <hr>
                
                <h5 class="mb-3"><i class="fas fa-bell me-2"></i>Notification Preferences</h5>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="notifyUpload" checked>
                            <label class="form-check-label" for="notifyUpload">Report upload success</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="notifyShare" checked>
                            <label class="form-check-label" for="notifyShare">When reports are shared</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="notifyAccess" checked>
                            <label class="form-check-label" for="notifyAccess">When someone accesses your reports</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="notifySystem" checked>
                            <label class="form-check-label" for="notifySystem">System updates</label>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <button class="btn btn-primary me-2">
                        <i class="fas fa-save me-2"></i>Save Settings
                    </button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </div>
        
        <!-- Danger Zone -->
        <div class="card mt-4 border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Danger Zone</h5>
            </div>
            <div class="card-body">
                <p class="text-muted">These actions are irreversible. Please proceed with caution.</p>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-danger" onclick="confirmDelete('all')">
                        <i class="fas fa-trash me-2"></i>Delete All Reports
                    </button>
                    <button class="btn btn-outline-danger" onclick="confirmDelete('account')">
                        <i class="fas fa-user-slash me-2"></i>Delete Account
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function confirmDelete(type) {
    const message = type === 'all' 
        ? 'Are you sure you want to delete ALL your medical reports? This action cannot be undone.'
        : 'Are you sure you want to delete your account and ALL associated data? This action cannot be undone.';
    
    if (confirm(message)) {
        alert('This functionality would be implemented in a production system.');
    }
}
</script>
{% endblock %}
