{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center text-center fade-in">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body py-5">
                <i class="fas fa-bug fa-5x text-danger mb-4"></i>
                <h1 class="display-4">500</h1>
                <h3 class="mb-4">Internal Server Error</h3>
                <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
                <div class="d-grid gap-2 col-lg-6 mx-auto">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>Back to Dashboard
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-secondary">
                        <i class="fas fa-redo me-2"></i>Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
